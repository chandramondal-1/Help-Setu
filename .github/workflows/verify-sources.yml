name: Verify official sources

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data, policy and source URLs
        run: node tools/validate.mjs --online
